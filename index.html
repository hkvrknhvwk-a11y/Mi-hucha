<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#174d35"><link rel="manifest" href="manifest.webmanifest"><title>Mi Hucha · 54 semanas</title><style>
:root{--g:#174d35;--m:#e9f4ec;--ink:#183126;--muted:#6b7b72;--line:#dce7df}*{box-sizing:border-box}body{margin:0;background:#f4f7f4;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:620px;margin:auto;padding:22px 16px 40px}header{background:var(--g);color:white;padding:24px 20px;border-radius:22px}h1{font-size:27px;margin:0 0 5px}header p{margin:0;opacity:.85}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.stat{background:white;border:1px solid var(--line);border-radius:16px;padding:15px}.stat small{display:block;color:var(--muted);margin-bottom:5px}.stat strong{font-size:25px}.progress{height:9px;background:#e2ebe4;border-radius:99px;overflow:hidden;margin:14px 0 4px}.bar{height:100%;width:0;background:#54a36b}.note{font-size:13px;color:var(--muted)}h2{font-size:18px;margin:24px 0 10px}.weeks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.week{background:white;border:1px solid var(--line);border-radius:14px;padding:12px 10px;display:flex;align-items:center;gap:8px;min-height:66px}.week input{width:21px;height:21px;accent-color:var(--g);flex:none}.week span{display:flex;flex-direction:column;gap:3px}.week b{font-size:14px}.week small{font-size:12px;color:var(--muted)}.week.done{background:var(--m);border-color:#a9cdb3}footer{margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:12px}button{border:0;border-radius:12px;padding:11px 14px;background:#e5ece7;color:var(--ink);font-weight:600}.reset{color:#9c3434;background:#f8eaea}@media(max-width:360px){.weeks{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><main><header><h1>💰 Mi Hucha</h1><p>Reto de ahorro · 54 semanas</p></header><section class="stats" aria-live="polite"><div class="stat"><small>Dinero ahorrado</small><strong id="total">0 €</strong></div><div class="stat"><small>Semanas completadas</small><strong id="count">0 / 54</strong></div></section><div class="progress"><div class="bar" id="bar"></div></div><div class="note" id="percent">0 % completado · Objetivo: 1.485 €</div><h2>Marca cada ingreso cuando lo hagas</h2><div class="weeks" id="weeks"></div><footer><span class="note">El progreso se guarda en este iPhone.</span><button class="reset" id="reset">Reiniciar</button></footer></main><script>
const KEY='mi-hucha-54-v1',goal=1485;let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){saved={}}const root=document.getElementById('weeks');for(let n=1;n<=54;n++){const label=document.createElement('label');label.className='week';label.dataset.week=n;const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!saved[n];cb.setAttribute('aria-label',`Semana ${n}, ${n} euro`);const txt=document.createElement('span');const b=document.createElement('b');b.textContent=`Semana ${n}`;const sm=document.createElement('small');sm.textContent=`${n} €`;txt.append(b,sm);label.append(cb,txt);root.append(label);cb.addEventListener('change',()=>{saved[n]=cb.checked;if(!cb.checked)delete saved[n];localStorage.setItem(KEY,JSON.stringify(saved));update()})}function update(){let count=0,total=0;document.querySelectorAll('.week').forEach(el=>{const cb=el.querySelector('input'),n=Number(el.dataset.week);el.classList.toggle('done',cb.checked);if(cb.checked){count++;total+=n}});document.getElementById('total').textContent=total.toLocaleString('es-ES')+' €';document.getElementById('count').textContent=`${count} / 54`;const pct=Math.round(total/goal*100);document.getElementById('bar').style.width=pct+'%';document.getElementById('percent').textContent=`${pct} % del objetivo · Objetivo: ${goal.toLocaleString('es-ES')} €`}document.getElementById('reset').addEventListener('click',()=>{if(confirm('¿Quieres borrar todos los ingresos marcados?')){saved={};localStorage.removeItem(KEY);document.querySelectorAll('.week input').forEach(cb=>cb.checked=false);update()}});update();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
